version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: bdm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bdm_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdm_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdm_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/bdm_platform
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: bdm-super-secret-cryptographic-signing-key-32chars
      DEFAULT_TIMEZONE: Asia/Kolkata
    ports:
      - "3000:3000"

volumes:
  pgdata:
